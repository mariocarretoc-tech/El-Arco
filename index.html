<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abarrotes - El Arco</title>
<link rel="stylesheet" href="css/estilos.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">
</head>

<body>
	<!-- Encabezado -->
	<header>
		<div class="header-container">
			<div class="logo">
				<h1>🛒 El Arco</h1>
			</div>
			<div class="nav-controls">
				<span class="cart-btn" id="cart-counter" onclick="abrirCarrito()">Mi
					Carrito(0)</span>
			</div>
		</div>
	</header>

	<!-- Banner promocional -->
	<section class="hero">
		<h2>Catálogo de Productos</h2>
		<p>Selecciona tus productos y envía a nuestro WhatsApp.</p>
	</section>

	<!-- Barra de Búsqueda Integrada -->
	<section class="search-container">
		<div class="search-wrapper">
			<input type="text" id="search-input"
				placeholder="🔍 Buscar producto..." oninput="buscarProducto()"
				class="search-input">
		</div>
	</section>

	<section class="categories" id="categories-container"></section>

	<!-- Cuadrícula de Productos -->
	<main class="products-section">
		<div class="products-grid" id="products-grid-container">
			<!-- Inyección por JS -->
		</div>
	</main>

        <div class="image-lightbox" id="imageLightbox" onclick="cerrarImagenAmpliada()">
        	<span class="close-lightbox">&times;</span>
        	<img class="lightbox-content" id="lightboxImg" src="" alt="Vista ampliada">
        </div>	

	<!-- Carrito Flotante -->
	<div class="cart-modal" id="cartModal">
		<div class="cart-content">
			<span class="close-cart" onclick="cerrarCarrito()">&times;</span>
			<h2 class="cart-title">Tu Carrito de Compras</h2>
			<div id="cart-items-container"></div>

			<div class="cart-total-section">
				Total: $<span id="cart-total-price">0.00</span>
			</div>

			<button class="checkout-btn" onclick="procesarCompra()">Proceder al Pago (WhatsApp)</button>
			<button class="clear-cart-btn" onclick="botonVaciarCarrito()">🗑️ Vaciar Carrito</button>
		</div>
	</div>

	<footer>
		<p>&copy; 2025 Abarrotes El Arco. Todos los derechos reservados.</p>
	</footer>

<script type="text/javascript">
	
        let categoriaActual = "Todos";
        let textoBusqueda = "";
		let productosInventario = [];
        let carrito = [];

	let paginaActual = 1;
	let productosPorPagina = 14; // Cambia este número según cuántos quieras mostrar por vista
       
        // Carga de forma asíncrona tanto el catálogo como el inventario/existencias
        async function inicializarCatalogo() {
            try {
                // 1. Cargamos de forma paralela productos.json y existencias.json
                const [respProductos, respExistencias] = await Promise.all([
                    fetch('productos.json'),
                    fetch('existencias.json') // <--- Archivo que evalúa el stock
                ]);

                if (!respProductos.ok) throw new Error('No se pudo leer el archivo productos.json');
                if (!respExistencias.ok) throw new Error('No se pudo leer el archivo existencias.json');

                const todosLosProductos = await respProductos.json();
                const existencias = await respExistencias.json();

                // 2. Creamos un mapa o diccionario rápido para buscar el stock por ID o Descripción
                // (Asumiendo que tus productos tienen una propiedad 'id' o 'codigo', si usan 'descripcion', cámbialo abajo)
                const mapaStock = {};
                existencias.forEach(item => {
                    // Usamos 'id' o 'descripcion' como llave de enlace
                    mapaStock[item.id] = item.stock; 
                });

                // 3. Filtramos los productos según las existencias (ej. stock > 0)
                productosInventario = todosLosProductos.filter(prod => {
                    const stockDisponible = mapaStock[prod.id] !== undefined ? mapaStock[prod.id] : 0;
                    return stockDisponible > 0; // Solo muestra si hay stock mayor a 0
                });
                
                generarCategoriasDinamicas();
                cargarProductos("Todos");
            } catch (error) {
                console.error("Error al cargar el catálogo o existencias:", error);
                document.getElementById('products-grid-container').innerHTML = `
                    <p style="grid-column: 1/-1; text-align: center; padding: 2rem; color: red; font-weight: bold;">
                        Error al cargar el inventario o las existencias. Verifica que los archivos existan y estés usando un servidor local.
                    </p>
                `;
            }
        }       

        function generarCategoriasDinamicas() {
            const container = document.getElementById('categories-container');
            if (!container) return;

            const departamentosUnicos = [...new Set(productosInventario.map(p => p.departamento))];
            const departamentosFiltrados = departamentosUnicos.filter(dept => dept && dept.trim() !== "");
            departamentosFiltrados.sort();

            let HTMLBotones = `<button class="cat-btn active" onclick="filtrarCategoria('Todos', this)">Todos</button>`;

            departamentosFiltrados.forEach(dept => {
                HTMLBotones += `<button class="cat-btn" onclick="filtrarCategoria('${dept}', this)">${dept}</button>`;
            });

            container.innerHTML = HTMLBotones;
        }

        function buscarProducto() {
            const input = document.getElementById('search-input');
            textoBusqueda = input.value.toLowerCase().trim();
            cargarProductos(categoriaActual);
        }

function cargarProductos(categoriaSeleccionada = "Todos", reiniciarPagina = true) {
            if (reiniciarPagina) {
                paginaActual = 1; // Si cambia de categoría o busca, regresamos a la página 1
            }

            categoriaActual = categoriaSeleccionada;
            const grid = document.getElementById('products-grid-container');
            if(!grid) return;
            grid.innerHTML = ""; 

            // 1. Filtrar por categoría
            let productosFiltrados = categoriaSeleccionada === "Todos" 
                ? productosInventario 
                : productosInventario.filter(p => p.departamento === categoriaSeleccionada);

            // 2. Filtrar por texto de búsqueda
            if (textoBusqueda !== "") {
                productosFiltrados = productosFiltrados.filter(p => 
                    p.descripcion.toLowerCase().includes(textoBusqueda)
                );
            }

            if (productosFiltrados.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; color: #888; padding: 3rem 1rem;">
                        <p style="font-size: 1.2rem; font-weight: 500;">No hay productos disponibles en este momento.</p>
                    </div>
                `;
                // Eliminamos controles de paginación si no hay resultados
                removerControlesPaginacion();
                return;
            }

            // 3. --- CÁLCULO DE PAGINACIÓN ---
            const totalPaginas = Math.ceil(productosFiltrados.length / productosPorPagina);
            if (paginaActual > totalPaginas) paginaActual = totalPaginas;

            const inicio = (paginaActual - 1) * productosPorPagina;
            const fin = inicio + productosPorPagina;
            const productosPaginaActual = productosFiltrados.slice(inicio, fin);

            // 4. Renderizar solo los productos de esta página
            productosPaginaActual.forEach((prod) => {
                const urlImagen = prod.imagen || 'https://via.placeholder.com/300x180?text=Sin+Foto';
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${urlImagen}" alt="${prod.descripcion}" class="product-img" onclick="abrirImagenAmpliada(this.src)" onerror="this.src='https://via.placeholder.com/300x180?text=Sin+Foto'">
                        
                        <div class="product-info">
                            <span class="product-badge">${prod.departamento}</span>
                            <h3 class="product-title">${prod.descripcion}</h3>
                            <p class="product-price">$${Number(prod.precio).toFixed(2)}</p>
                            <button class="add-to-cart" onclick="agregarAlCarrito('${prod.descripcion}', ${prod.precio})">Agregar al carrito</button>
                        </div>
                    </div>
                `;
            });

            // 5. Renderizar botones de paginación abajo de la cuadrícula
            renderizarControlesPaginacion(totalPaginas);
        }
        
        function abrirImagenAmpliada(srcSrc) {
            const lightbox = document.getElementById('imageLightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            lightboxImg.src = srcSrc;
            lightbox.style.display = 'flex';
        }

        function cerrarImagenAmpliada() {
            document.getElementById('imageLightbox').style.display = 'none';
        }
        
        function filtrarCategoria(categoria, boton) {
            const botones = document.querySelectorAll('.cat-btn');
            botones.forEach(btn => btn.classList.remove('active'));
            boton.classList.add('active');
            cargarProductos(categoria);
        }

        function agregarAlCarrito(nombre, precio) {
            const productoExistente = carrito.find(item => item.nombre === nombre);
            if (productoExistente) { productoExistente.cantidad++; } 
            else { carrito.push({ nombre: nombre, precio: precio, cantidad: 1 }); }
            actualizarInterfaz();
        }

        function cambiarCantidad(nombre, cambio) {
            const producto = carrito.find(item => item.nombre === nombre);
            if (producto) {
                producto.cantidad += cambio;
                if (producto.cantidad <= 0) {
                    carrito = carrito.filter(item => item.nombre !== nombre);
                }
            }
            actualizarInterfaz();
        }

        function actualizarInterfaz() {
            const totalItems = carrito.reduce((acumulador, item) => acumulador + item.cantidad, 0);
            document.getElementById('cart-counter').innerText = `Mi Carrito (${totalItems})`;

            const container = document.getElementById('cart-items-container');
            container.innerHTML = ""; 

            if (carrito.length === 0) {
                container.innerHTML = '<p class="empty-message">Tu carrito está vacío.</p>';
            } else {
                carrito.forEach(item => {
                    container.innerHTML += `
                        <div class="cart-item">
                            <div class="item-details">
                                <h4>${item.nombre}</h4>
                                <p>$${item.precio.toFixed(2)} c/u - Total: $${(item.precio * item.cantidad).toFixed(2)}</p>
                            </div>
                            <div class="quantity-controls">
                                <button onclick="cambiarCantidad('${item.nombre}', -1)">-</button>
                                <span>${item.cantidad}</span>
                                <button onclick="cambiarCantidad('${item.nombre}', 1)">+</button>
                            </div>
                        </div>
                    `;
                });
            }

            const granTotal = carrito.reduce((acumulador, item) => acumulador + (item.precio * item.cantidad), 0);
            document.getElementById('cart-total-price').innerText = granTotal.toFixed(2);
        }

        function abrirCarrito() { document.getElementById('cartModal').style.display = 'flex'; }
        function cerrarCarrito() { document.getElementById('cartModal').style.display = 'none'; }

        function procesarCompra() {
            if (carrito.length === 0) return;
            const numeroTelefono = "528148226556";
            let mensaje = "🛒 *NUEVO PEDIDO - ABARROTES EL ARCO*\n\n";

            carrito.forEach(item => {
                mensaje += `• *${item.nombre}*\n  Cantidad: ${item.cantidad} x $${item.precio.toFixed(2)} = *$${(item.precio * item.cantidad).toFixed(2)}*\n\n`;
            });

            const granTotal = carrito.reduce((acumulador, item) => acumulador + (item.precio * item.cantidad), 0);
            mensaje += `--------------------------------------\n💰 *TOTAL A PAGAR: $${granTotal.toFixed(2)}*`;

            window.open(`https://wa.me/${numeroTelefono}?text=${encodeURIComponent(mensaje)}`, '_blank');

            carrito = [];            
            actualizarInterfaz();        
            cerrarCarrito();            
            alert("¡Pedido enviado! Hemos transferido tu carrito a WhatsApp para finalizar tu compra.");
        }

        function botonVaciarCarrito() {
            if (carrito.length === 0) return;
            if (confirm("¿Estás seguro de que deseas eliminar todos los productos de tu carrito?")) {
                carrito = [];          
                actualizarInterfaz();  
                cerrarCarrito();       
                restablecerCategoriaTodos();
                alert("El carrito ha sido vaciado.");
            }
        }

        function restablecerCategoriaTodos() {
            const botones = document.querySelectorAll('.cat-btn');
            botones.forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.trim().toLowerCase() === 'todos') {
                    btn.classList.add('active');
                }
            });
            cargarProductos("Todos");
        }

function renderizarControlesPaginacion(totalPaginas) {
            let contenedorPaginacion = document.getElementById('pagination-container');
            
            // Si el contenedor no existe, lo creamos dinámicamente debajo de la sección de productos
            if (!contenedorPaginacion) {
                contenedorPaginacion = document.createElement('div');
                contenedorPaginacion.id = 'pagination-container';
                contenedorPaginacion.style.cssText = "display: flex; justify-content: center; align-items: center; gap: 1rem; margin-top: 2rem; grid-column: 1/-1;";
                document.getElementById('products-grid-container').after(contenedorPaginacion);
            }

            contenedorPaginacion.innerHTML = "";

            if (totalPaginas <= 1) return; // Si solo hay una página, no mostramos botones

            // Botón Anterior
            contenedorPaginacion.innerHTML += `
                <button onclick="cambiarPagina(${paginaActual - 1})" ${paginaActual === 1 ? 'disabled style="opacity: 0.5; cursor: not-allowed;"' : ''} class="cat-btn">⬅️ Anterior</button>
                <span style="font-weight: bold; color: var(--dark);">Página ${paginaActual} de ${totalPaginas}</span>
                <button onclick="cambiarPagina(${paginaActual + 1})" ${paginaActual === totalPaginas ? 'disabled style="opacity: 0.5; cursor: not-allowed;"' : ''} class="cat-btn">Siguiente ➡️</button>
            `;
        }

        function removerControlesPaginacion() {
            const contenedorPaginacion = document.getElementById('pagination-container');
            if (contenedorPaginacion) contenedorPaginacion.innerHTML = "";
        }

        function cambiarPagina(nuevaPagina) {
            paginaActual = nuevaPagina;
            cargarProductos(categoriaActual, false); // false para que no reinicie a la página 1
            window.scrollTo({ top: 300, behavior: 'smooth' }); // Sube suavemente la vista al cambiar de página
        }

        document.addEventListener("DOMContentLoaded", () => {
            inicializarCatalogo();
        });
    </script>
</body>
</html>
